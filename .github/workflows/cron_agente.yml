name: Executar Agente de Vagas

on:
  schedule:
    - cron: '0 1,11,13,15,17,19,21,23 * * *'  # Roda 8x ao dia: 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00 e 22:00 (Horário de Brasília)
  workflow_dispatch:       # Permite execução manual via botão no GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar Script Principal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MASTER_PROFILE_JSON: ${{ secrets.MASTER_PROFILE_JSON }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
